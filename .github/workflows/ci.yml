name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    # macOS: el código usa vm_stat, sysctl y memory_pressure.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Herramientas del sistema
        run: brew install poppler

      - name: Instalar paquete Python
        run: python -m pip install -e .

      - name: Pruebas Python
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Instalar dependencias UI
        working-directory: ui
        run: npm ci

      - name: Auditoría npm
        working-directory: ui
        run: npm audit --audit-level=high

      - name: Compilar UI
        working-directory: ui
        run: npm run build
